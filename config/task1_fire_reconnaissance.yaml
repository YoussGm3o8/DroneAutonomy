# Task 1: Fire Reconnaissance Configuration
# Competition task for performing reconnaissance and equipment staging at fire scene

task_name: "fire_reconnaissance"
task_id: 1
max_duration_minutes: 30
timeout: 1800  # 30 minutes in seconds

# Drone Configuration
drone_type: "quadcopter"  # Options: "quadcopter", "vtol_tiltrotor"
uav_count: 1
uav_weights_g: [1200]  # Empty weight of UAV(s) in grams
battery_swap_allowed: false

# Flight Boundaries (populated from GUI)
soft_boundary: []  # List of [lat, lon] coordinates
hard_boundary: []  # List of [lat, lon] coordinates
altitude_limit_ft: 400

# Building/Fire Scene Configuration
building_gps: [0.0, 0.0, 0.0]  # [lat, lon, alt] - populated from GUI
building_dimensions: [0.0, 0.0, 0.0]  # [length, width, height] in meters
building_orientation: 0.0  # Compass bearing of north face (degrees)
scene_buffer_m: 15.0  # Buffer zone around building perimeter
max_scene_altitude_agl_m: 10.0  # Maximum altitude within scene

# Lap Course Navigation
lap_waypoints: []  # List of [lat, lon, alt] waypoints
target_laps: 3  # Number of laps to attempt (0 = direct flight)
count_return_laps: false  # Only count laps TO the scene

# Equipment Selection and Configuration
equipment_selection:
  radio: true     # Handheld radio (500g, 5pts)
  oxygen: true    # Oxygen tank (1000g, 5pts)
  ladder: false   # Ladder (3000g, 10pts)

# Staging Pad Detection
staging_pad_model_path: "models/staging_pad_detector.pt"
staging_pad_diameter_inches: 32
staging_pad_confidence: 0.7
staging_pad_nms_threshold: 0.4

# Target Detection Configuration
target_colors:
  - "black"
  - "white"
  - "red"
  - "yellow"
  - "blue"
  - "green"

target_size_range_cm: [5, 30]  # Min and max diameter
target_detection_confidence: 0.6
target_localization_accuracy_required_m: 1.5  # For scoring threshold

# AI Description System (OpenRouter API)
ai_description_enabled: true
ai_provider: "openrouter"
ai_model: "nvidia/nemotron-nano-12b-v2-vl:free"
ai_api_key: ""  # Set from GUI settings
ai_api_endpoint: "https://openrouter.ai/api/v1/chat/completions"
ai_max_retries: 3
ai_timeout_seconds: 30
ai_temperature: 0.7

# Description Requirements
description_language: "english"  # "english" or "french"
description_precision_m: 0.1  # Decimetre precision
use_gps_coordinates: false  # Must use landmarks only
require_color: true
require_height: true
require_wall_distance: true

# Competition Scoring Components
scoring:
  target_detection: 25  # Points for target localization
  equipment_delivery: 20  # Points for equipment staging
  distance_flown: 30  # Points for lap completion
  payload_fraction: 20  # Points for payload ratio
  safe_landing: 5  # Points for safe return

# Scoring Thresholds
accuracy_thresholds_m:
  excellent: 0.5   # ×100% score
  good: 1.0        # ×75% score
  acceptable: 1.5  # ×50% score
  # >1.5m = ×0% score

delivery_accuracy_thresholds_m:
  full_score: 2.0  # ≤2m from staging point
  # >2m = ×50% score

payload_fraction_max: 0.35  # Maximum scoring at 35% payload

# Safety Limits
max_altitude: 122  # 400ft in meters
min_altitude: 0.5  # Minimum safe altitude
max_speed: 15.0  # m/s
safety_distance: 2.0  # Distance from obstacles

# Boundary Monitoring
boundary_check_interval_s: 1.0
boundary_warning_distance_m: 10.0  # Distance to trigger soft warning
emergency_stop_on_hard_violation: true

# Navigation Parameters (Drone-type specific)
quadcopter:
  hover_stability_time_s: 2.0
  max_horizontal_speed_ms: 5.0
  max_vertical_speed_ms: 2.0
  landing_descent_rate_ms: 0.5
  equipment_drop_altitude_m: 0.3  # Hover altitude for equipment release

vtol_tiltrotor:
  cruise_speed_ms: 15.0  # Fixed-wing cruise
  transition_time_s: 5.0  # Time to transition to/from VTOL
  hover_stability_time_s: 3.0
  max_horizontal_speed_vtol_ms: 3.0
  max_vertical_speed_ms: 1.5
  landing_descent_rate_ms: 0.3
  equipment_drop_altitude_m: 0.5
  use_fixedwing_for_laps: true  # Use fixed-wing mode during lap course

# Output Configuration
output_dir: "output/task1"
log_dir: "logs/task1"
photos_dir: "output/photos/task1"
team_name: "DroneTeam"  # Set from GUI

# Target Descriptions Output
targets_filename_template: "Task_1_{team_name}_targets.txt"
upload_to_google_drive: false  # Manual upload required

# Performance Monitoring
log_telemetry: true
telemetry_log_interval_s: 1.0
capture_photos_on_detection: true
photo_format: "jpg"
photo_quality: 95

# Debug Options
debug_mode: false
visualize_boundaries: true
visualize_targets: true
save_detection_frames: true
verbose_logging: true
