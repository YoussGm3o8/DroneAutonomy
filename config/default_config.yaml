# DroneAutonomy Vision Pipeline Configuration

# Video input configuration
video:
  # GStreamer pipeline for RTSP stream from drone (1080p 60fps)
  # FIXED: Using UDP protocol (default) instead of TCP for better compatibility
  gstreamer_pipeline: "rtspsrc location=rtsp://192.168.1.231:8554/1 latency=0 ! rtph265depay ! h265parse ! avdec_h265 ! videoconvert ! video/x-raw,format=BGR ! appsink drop=true max-buffers=1 sync=false"
  width: 1920
  height: 1080
  fps: 60
  backend: gstreamer  # Options: gstreamer, opencv
  camera_id: 0  # For opencv backend

# Camera calibration parameters
camera:
  fx: 750.0  # Focal length x (scaled for 1920x1080)
  fy: 750.0  # Focal length y (scaled for 1920x1080)
  cx: 960.0  # Principal point x (center of 1920)
  cy: 540.0  # Principal point y (center of 1080)
  k1: 0.0    # Radial distortion k1
  k2: 0.0    # Radial distortion k2
  p1: 0.0    # Tangential distortion p1
  p2: 0.0    # Tangential distortion p2

# Visual Inertial Odometry configuration
vio:
  enabled: true
  type: vins-mono  # Options: vins-mono, orb-slam3
  imu_rate: 200
  output_rate: 30

# Depth estimation configuration
depth:
  model: dpt_hybrid  # Depth model selection - RECOMMENDED: dpt_hybrid for best balance
  # Options: 
  #   - dpt_hybrid (MiDaS DPT_Hybrid - RECOMMENDED: Fast 140ms with high quality)
  #   - dpt_large (MiDaS DPT_Large - Highest quality 174ms)
  #   - midas_small (MiDaS Small - Lightweight 246ms for memory-constrained devices)
  #   - depth_anything_v2_vits (Depth Anything V2 Small - balanced speed/quality)
  #   - depth_anything_v2_vitb (Depth Anything V2 Base - better quality, slower)
  #   - depth_anything_v2_vitl (Depth Anything V2 Large - best quality, slowest)
  device: cuda  # Options: cuda, cpu
  input_size: [640, 480]  # Depth processing resolution (width, height)
  output_scale: 0.5  # Scale down output if needed (0.5 = 320x240 final output)
  
  # Metric depth calibration (converts relative depth to actual meters)
  use_metric_calibration: true  # Enable altitude-based depth calibration
  
  # Camera parameters for geometric calibration
  image_width: 1920
  image_height: 1080
  horizontal_fov: 90.0  # Horizontal field of view in degrees
  
  # Calibration settings
  use_altitude_calibration: true  # Use barometer/GPS altitude to calibrate scale
  use_ground_plane: true  # Estimate ground plane for additional constraint
  min_altitude_for_calibration: 1.0  # Minimum altitude (meters) for calibration
  ground_plane_sample_region: 0.3  # Use bottom 30% of image for ground detection
  
  # Fallback depth ranges (when not calibrated or no telemetry)
  default_max_range: 10.0  # Maximum detectable distance (meters)
  default_min_range: 0.5   # Minimum detectable distance (meters)

# Red circular target detection configuration (OpenCV - lightweight and fast)
target_detection:
  hsv_lower: [0, 100, 100]   # Lower HSV threshold for red
  hsv_upper: [10, 255, 255]  # Upper HSV threshold for red
  min_radius: 10
  max_radius: 200
  circle_threshold: 0.7
  downscale_factor: 2  # Process at half resolution for 5x speedup

# MAVLink telemetry configuration
mavlink:
  connection_string: "udp:127.0.0.1:14550"  # Primary MAVLink connection (UDP)
  baud: 57600  # Baud rate for serial connections
  auto_detect: true  # Auto-detect USB serial ports if UDP fails
  heartbeat_timeout: 5  # Seconds to wait for heartbeat per connection attempt
  vio_publish_rate: 30  # Hz
  telemetry_rate: 10    # Hz

# Fusion and decision layer configuration
fusion:
  depth_weight: 0.6
  detection_weight: 0.4
  min_confidence: 0.6
  proximity_threshold: 2.0  # meters

# AirSim simulation configuration
simulation:
  enabled: false
  airsim_ip: 127.0.0.1
  airsim_port: 41451

# Logging configuration
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  save_video: false
  save_detections: true
  log_dir: logs

# Autonomous navigation configuration
autonomous:
  # Obstacle detection parameters
  obstacle_distance_threshold: 3.0  # meters
  
  # Target approach parameters
  approach_distance_target: 2.0  # meters
  approach_distance_min: 1.5  # meters
  centering_tolerance: 50  # pixels
  
  # PID controller gains
  pid_kp: 0.5
  pid_ki: 0.1
  pid_kd: 0.2
  
  # Speed limits
  max_yaw_rate: 30.0  # deg/s
  max_forward_speed: 1.0  # m/s
  max_lateral_speed: 0.5  # m/s
  
  # Logging
  log_dir: logs/autonomous
  photo_dir: logs/autonomous/photos
  
  # Obstacle avoidance (Tesla-style visualization)
  obstacle_avoidance:
    # Core parameters
    obstacle_distance_threshold: 3.0  # meters
    critical_distance: 1.5  # meters
    warning_distance: 2.5  # meters
    min_clearance: 1.0  # meters
    safety_margin: 0.5  # meters
    
    # Detection zones
    num_zones_horizontal: 5
    num_zones_vertical: 3
    
    # Path planning
    num_path_candidates: 7
    path_horizon: 80  # pixels
    path_lateral_range: 150  # pixels
    
    # Visualization
    show_zones: true
    show_paths: true
    show_obstacles: true
    path_alpha: 0.65
    
    # Target integration
    target_priority: true
    target_override_distance: 5.0  # meters
  
  # Proximity sensors (ArduPilot integration)
  proximity:
    enabled: false  # Enable when rangefinders installed
    critical_distance: 1.5  # meters
    warning_distance: 2.5  # meters
    sensor_timeout: 1.0  # seconds
    enabled_directions:
      - forward
      - left
      - right
      - down
  
  # Safety arbitration (combines vision + sensors)
  safety_arbitration:
    enabled: false  # Enable when proximity sensors active
    mode: parallel_redundant  # Options: vision_primary, sensor_primary, parallel_redundant, sensor_fusion
    vision_weight: 0.7  # For sensor_fusion mode
    sensor_weight: 0.3
    emergency_distance: 1.0  # meters - hardware override threshold
    critical_distance: 1.5  # meters
