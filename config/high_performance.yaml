# DroneAutonomy Vision Pipeline Configuration - HIGH PERFORMANCE MODE
# Optimized for 20+ FPS real-time performance

# Video input configuration
video:
  # GStreamer pipeline for RTSP stream from drone (1080p 60fps)
  # Validated working with custom OpenCV + GStreamer 1.26.7
  # Drop frames and reduce latency for real-time display
  gstreamer_pipeline: "rtspsrc location=rtsp://192.168.1.231:8554/1 latency=0 ! decodebin ! videoconvert ! appsink drop=true max-buffers=1"
  width: 1920
  height: 1080
  fps: 60
  backend: gstreamer  # Options: gstreamer, opencv
  camera_id: 0  # For opencv backend

# Camera calibration parameters
camera:
  fx: 750.0  # Focal length x (scaled for 1920x1080)
  fy: 750.0  # Focal length y (scaled for 1920x1080)
  cx: 960.0  # Principal point x (center of 1920)
  cy: 540.0  # Principal point y (center of 1080)
  k1: 0.0    # Radial distortion k1
  k2: 0.0    # Radial distortion k2
  p1: 0.0    # Tangential distortion p1
  p2: 0.0    # Tangential distortion p2

# Visual Inertial Odometry configuration
vio:
  enabled: false  # Disabled for max FPS
  type: vins-mono  # Options: vins-mono, orb-slam3
  imu_rate: 200
  output_rate: 30

# Depth estimation configuration
depth:
  model: dpt_hybrid  # Fast MiDaS model with high quality (140ms/7 FPS)
  device: cuda  # Options: cuda, cpu
  input_size: [384, 384]  # Optimal for DPT models
  output_scale: 0.5

# YOLO object detection configuration - OPTIMIZED
detection:
  yolo_model: yolov8n.pt  # Fastest YOLO variant
  confidence_threshold: 0.6  # Slightly higher to reduce false positives
  nms_threshold: 0.4
  device: cuda
  use_tensorrt: false  # Enable for optimized inference (requires setup)
  imgsz: 416  # Reduced from default 640 for faster inference
  classes:
    - person
    - car
    - truck
    - bicycle
    - motorcycle

# Red circular target detection configuration
target_detection:
  hsv_lower: [0, 100, 100]   # Lower HSV threshold for red
  hsv_upper: [10, 255, 255]  # Upper HSV threshold for red
  min_radius: 10
  max_radius: 200
  circle_threshold: 0.7
  downscale_factor: 2  # Process at half resolution for 4x speedup

# MAVLink telemetry configuration
mavlink:
  connection_string: "udp:127.0.0.1:14550"  # Primary MAVLink connection (UDP)
  baud: 57600  # Baud rate for serial connections
  auto_detect: true  # Auto-detect USB serial ports if UDP fails
  heartbeat_timeout: 5  # Seconds to wait for heartbeat per connection attempt
  vio_publish_rate: 30  # Hz
  telemetry_rate: 10    # Hz

# Fusion and decision layer configuration
fusion:
  depth_weight: 0.6
  detection_weight: 0.4
  min_confidence: 0.6
  proximity_threshold: 2.0  # meters

# AirSim simulation configuration
simulation:
  enabled: false
  ip: 127.0.0.1
  timeout: 10

# Logging configuration
logging:
  level: WARNING  # Reduced logging for performance
  log_dir: logs
